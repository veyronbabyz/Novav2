name: Build Nova AI APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses and install packages
        shell: bash
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "NovaAI-Real-Android/settings.gradle" ] || [ -f "NovaAI-Real-Android/settings.gradle.kts" ]; then
            echo "dir=NovaAI-Real-Android" >> "$GITHUB_OUTPUT"
          else
            echo "Could not find the Android Gradle project."
            echo "Make sure the ZIP was extracted and its project files are uploaded, not just the ZIP file."
            find . -maxdepth 5 -type f | sort | head -200
            exit 1
          fi

      - name: Build debug APK
        shell: bash
        run: |
          cd "${{ steps.project.outputs.dir }}"
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            echo "gradlew is missing. The Android project should include its Gradle wrapper."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaAI-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          
