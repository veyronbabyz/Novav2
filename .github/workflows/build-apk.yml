name: Build Nova AI APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate and install Android SDK packages
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          if ! command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -n 1)"
            if [ -z "$SDKMANAGER" ]; then
              echo "sdkmanager was not found on this GitHub runner."
              exit 1
            fi
            echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          fi
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Unpack Nova AI source ZIP
        run: |
          if [ ! -f "NovaAI-Real-Android-Source.zip" ]; then
            echo "Upload NovaAI-Real-Android-Source.zip to the repository root first."
            exit 1
          fi
          unzip -o "NovaAI-Real-Android-Source.zip" -d source

      - name: Build debug APK
        run: gradle -p source/NovaAI-Real-Android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaAI-debug-apk
          path: source/NovaAI-Real-Android/app/build/outputs/apk/debug/app-debug.apk
          
