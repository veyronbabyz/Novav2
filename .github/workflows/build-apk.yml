name: Build Nova AI APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android SDK manager and install packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Could not find sdkmanager under $SDK_ROOT"
            exit 1
          fi
          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          export PATH="$SDKMANAGER_DIR:$PATH"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "app/settings.gradle" ] || [ -f "app/settings.gradle.kts" ]; then
            echo "dir=app" >> "$GITHUB_OUTPUT"
          elif [ -f "NovaAI-Real-Android/settings.gradle" ] || [ -f "NovaAI-Real-Android/settings.gradle.kts" ]; then
            echo "dir=NovaAI-Real-Android" >> "$GITHUB_OUTPUT"
          elif [ -f "NovaAI-Real-Android/app/settings.gradle" ] || [ -f "NovaAI-Real-Android/app/settings.gradle.kts" ]; then
            echo "dir=NovaAI-Real-Android/app" >> "$GITHUB_OUTPUT"
          else
            echo "Could not find settings.gradle or settings.gradle.kts. Check that the Android project files are uploaded and extracted into the repository."
            find . -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

      - name: Build debug APK
        run: |
          cd "${{ steps.project.outputs.dir }}"
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaAI-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
